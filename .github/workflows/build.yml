name: Build VISION TV (APK assinado + Release)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto do ZIP
        run: |
          if [ ! -f VisionTV.zip ]; then
            echo "ERRO: VisionTV.zip não encontrado na raiz do repositório"; exit 1
          fi
          mkdir project
          unzip -q VisionTV.zip -d project
          ls project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release assinado
        working-directory: project
        run: gradle assembleRelease --stacktrace -PVERSION_CODE=${{ github.run_number }} -PUPDATE_REPO=${{ github.repository }}

      - name: Preparar APK
        run: cp project/app/build/outputs/apk/release/app-release.apk VISION-TV-1.0.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VISION TV 1.0 (build ${{ github.run_number }})
          files: VISION-TV-1.0.apk
